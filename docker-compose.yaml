services:
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    environment:
      - COLLECTOR_ZIPKIN_HTTP_PORT=9411
    ports:
      - "5775:5775/udp"
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "5778:5778"
      - "16686:16686"
      - "14268:14268"
      - "14250:14250"
      - "9411:9411"
    networks:
      - chord_network

  bootstrap:
    image: bootstrap-server:1.0
    container_name: bootstrap
    ports:
      - "55555:55555/udp"
    depends_on:
      - jaeger
    networks:
      - chord_network

  chord-jellyfish:
    image: chord-kv:1.4
    container_name: chord-jellyfish
    ports:
      - "7071:80"
    environment:
      - OTEL_EXPORTER_JAEGER_ENDPOINT=http://jaeger:14268/api/traces
    command: --port=80 --publichost=chord-jellyfish --bootstrap=bootstrap:55555 --username=jellyfish --M=3 --ringSize=9
    depends_on:
      - bootstrap
    networks:
      - chord_network

  chord-seamonkey:
    image: chord-kv:1.4
    container_name: chord-seamonkey
    ports:
      - "7073:80"
    environment:
      - OTEL_EXPORTER_JAEGER_ENDPOINT=http://jaeger:14268/api/traces
    command: --port=80 --publichost=chord-seamonkey --bootstrap=bootstrap:55555 --username=seamonkey --M=3 --ringSize=9
    depends_on:
      - chord-jellyfish
    networks:
      - chord_network

  chord-papaya:
    image: chord-kv:1.4
    container_name: chord-papaya
    ports:
      - "7075:80"
    environment:
      - OTEL_EXPORTER_JAEGER_ENDPOINT=http://jaeger:14268/api/traces
    command: --port=80 --publichost=chord-papaya --bootstrap=bootstrap:55555 --username=papaya --M=3 --ringSize=9
    depends_on:
      - chord-seamonkey
    networks:
      - chord_network

networks:
  chord_network:
    driver: bridge